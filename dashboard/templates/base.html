<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botground — Sentiment Analysis</title>
    <!-- Favicon Botground -->
    <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='images/botground-logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
</head>

<body>
    <div class="layout">

        <!-- ─── SIDEBAR ─── -->
        <aside class="sidebar">

            <!-- Logo -->
            <div class="sidebar-logo">
                <div class="logo-icon">
                <img src="{{ url_for('static', filename='images/botground-logo.png') }}"
                    alt="Botground Logo">
            </div>
                <div class="logo-text">
                    <div class="brand">Botground</div>
                    <div class="tagline">Sentiment Analysis</div>
                </div>
            </div>

            <!-- Navigation -->
            <div class="nav-section-label">Menu</div>
            <nav>
                <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7" />
                        <rect x="14" y="3" width="7" height="7" />
                        <rect x="3" y="14" width="7" height="7" />
                        <rect x="14" y="14" width="7" height="7" />
                    </svg>
                    Overview
                </a>
                <a href="{{ url_for('analyze') }}"
                    class="nav-link {% if request.endpoint == 'analyze' %}active{% endif %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
                    </svg>
                    Live Analysis
                </a>
                <a href="{{ url_for('conversations') }}"
                    class="nav-link {% if request.endpoint == 'conversations' %}active{% endif %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg>
                    Conversations
                </a>
                <a href="{{ url_for('analytics') }}"
                    class="nav-link {% if request.endpoint == 'analytics' %}active{% endif %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="20" x2="18" y2="10" />
                        <line x1="12" y1="20" x2="12" y2="4" />
                        <line x1="6" y1="20" x2="6" y2="14" />
                    </svg>
                    Analytics
                </a>
            </nav>


        </aside>

        <!-- ─── MAIN CONTENT ─── -->
        <main class="main">
            {% block content %}{% endblock %}
        </main>

    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <!-- Global JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
